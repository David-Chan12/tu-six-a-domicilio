<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar Sesión | Jurisdicción Sanitaria No. 2</title>
  
  <!-- Tipografía Moderna (Inter) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Íconos FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- SweetAlert2 para alertas elegantes -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --bg-principal: #ffffff;
      --bg-secundario: #f4f4f6;
      --tarjeta-bg: #f9f9fb;
      --texto-titulos: #0f0f11;
      --texto-cuerpo: #4a4a52;
      --texto-mutado: #71717a;
      --borde-suave: #e4e4e7;
      --accent-black: #18181b;
      --accent-hover: #27272a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-principal);
      color: var(--texto-cuerpo);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      -webkit-font-smoothing: antialiased;
    }

    nav {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      padding: 24px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-badge {
      background-color: var(--bg-secundario);
      color: var(--texto-titulos);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .auth-container {
      max-width: 480px;
      margin: 20px auto 60px auto;
      padding: 40px;
      background-color: var(--tarjeta-bg);
      border: 1px solid var(--borde-suave);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      width: 100%;
    }

    .auth-container h2 {
      color: var(--texto-titulos);
      font-size: 4.00rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      text-align: center;
    }

    .auth-container p.sub {
      color: var(--texto-mutado);
      font-size: 0.95rem;
      text-align: center;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--texto-titulos);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background-color: #ffffff;
      border: 1px solid var(--borde-suave);
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      color: var(--texto-titulos);
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent-black);
      box-shadow: 0 0 0 3px rgba(24, 24, 27, 0.08);
    }

    .btn-submit {
      background-color: var(--accent-black);
      color: #ffffff;
      border: none;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    /* Botón de Registro secundario que reemplaza al de Google */
    .btn-link-registro {
      background-color: #ffffff;
      color: var(--texto-titulos);
      border: 1px solid var(--borde-suave);
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      transition: background-color 0.2s ease;
      margin-top: 15px;
    }

    .btn-link-registro:hover {
      background-color: var(--bg-secundario);
    }

    .separator {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--texto-mutado);
      font-size: 0.85rem;
      margin: 20px 0;
    }

    .separator::before, .separator::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--borde-suave);
    }

    .separator::before { margin-right: 10px; }
    .separator::after { margin-left: 10px; }

    footer {
      border-top: 1px solid var(--borde-suave);
      padding: 20px 30px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--texto-mutado);
    }

    @media (max-width: 480px) {
      .auth-container {
        padding: 20px;
        margin: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- NAVEGACIÓN SUPERIOR -->
  <nav>
    <div class="brand-badge">Jurisdicción Sanitaria No. 2</div>
    <span style="font-size: 0.85rem; color: var(--texto-mutado);">Control Patrimonial de TI</span>
  </nav>

  <!-- CONTENEDOR PRINCIPAL DE ACCESO -->
  <main class="auth-container">
    <h2>Bienvenido</h2>
    <p class="sub">Ingresa con tus credenciales institucionales.</p>

    <form id="formLogin" onsubmit="manejarLogin(event)">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" required placeholder="correo@ejemplo.com">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn-submit">Iniciar Sesión</button>
    </form>

    <div class="separator">¿No tienes cuenta?</div>

    <!-- Botón que toma el lugar del de Google para ir al registro -->
    <a href="registro.html" class="btn-link-registro">
      <i class="fa-solid fa-user-plus" style="color: var(--texto-titulos);"></i> Crear una cuenta nueva
    </a>
  </main>

  <!-- PIE DE PÁGINA -->
  <footer>
    Servicios de Salud de Yucatán &copy; 2026 | Plataforma Web de Inventarios
  </footer>

  <!-- SCRIPTS DE FIREBASE Y LÓGICA DE ACCESO -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Credenciales de tu base de datos Firebase[cite: 10]
    const firebaseConfig = {
      apiKey: "AIzaSyD_y1EWlyWL054e1k8T3mkB8ROUoMD3tWs",
      authDomain: "control-de-equipos-762c4.firebaseapp.com",
      projectId: "control-de-equipos-762c4",
      storageBucket: "control-de-equipos-762c4.firebasestorage.app",
      messagingSenderId: "711982599026",
      appId: "1:711982599026:web:ba92c737011b38f882abeb",
      measurementId: "G-X1M2R00M55"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Función de Inicio de Sesión con Correo y Contraseña
    window.manejarLogin = async function(event) {
      event.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        Swal.fire({ title: 'Iniciando sesión...', text: 'Verificando credenciales', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        // 1. Validar en Firebase Auth[cite: 9]
        const credenciales = await signInWithEmailAndPassword(auth, email, password);
        const uid = credenciales.user.uid;

        // 2. Comprobar perfil y rol en Firestore[cite: 9]
        const docSnap = await getDoc(doc(db, "usuarios", uid));
        if (docSnap.exists() && docSnap.data().activo) {
          const usuarioData = docSnap.data();
          
          Swal.fire({
            title: `¡Bienvenido, ${usuarioData.nombre}!`,
            text: `Rol asignado: ${usuarioData.rol}`,
            icon: 'success',
            timer: 1800,
            showConfirmButton: false
          }).then(() => {
            window.location.href = "index.html";
          });
        } else {
          Swal.fire('Acceso denegado', 'El usuario no existe o se encuentra desactivado en la base de datos.', 'error');
        }

      } catch (error) {
        console.error("Error en login:", error);
        Swal.fire('Error de Acceso', 'Correo o contraseña incorrectos.', 'error');
      }
    };
  </script>
</body>
</html>
