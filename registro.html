<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de Usuario | Jurisdicción Sanitaria No. 2</title>
  
  <!-- Tipografía Moderna (Inter) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Íconos FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- SweetAlert2 para alertas elegantes -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --bg-principal: #ffffff;
      --bg-secundario: #f4f4f6;
      --tarjeta-bg: #f9f9fb;
      --texto-titulos: #0f0f11;
      --texto-cuerpo: #4a4a52;
      --texto-mutado: #71717a;
      --borde-suave: #e4e4e7;
      --accent-black: #18181b;
      --accent-hover: #27272a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-principal);
      color: var(--texto-cuerpo);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      -webkit-font-smoothing: antialiased;
    }

    nav {
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      padding: 24px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-badge {
      background-color: var(--bg-secundario);
      color: var(--texto-titulos);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
    }

    .registro-container {
      max-width: 600px;
      margin: 20px auto 60px auto;
      padding: 40px;
      background-color: var(--tarjeta-bg);
      border: 1px solid var(--borde-suave);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      width: 100%;
    }

    .registro-container h2 {
      color: var(--texto-titulos);
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      text-align: center;
    }

    .registro-container p.sub {
      color: var(--texto-mutado);
      font-size: 0.95rem;
      text-align: center;
      margin-bottom: 30px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group.full {
      grid-column: span 2;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--texto-titulos);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 12px 16px;
      background-color: #ffffff;
      border: 1px solid var(--borde-suave);
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      color: var(--texto-titulos);
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent-black);
      box-shadow: 0 0 0 3px rgba(24, 24, 27, 0.08);
    }

    .btn-submit {
      background-color: var(--accent-black);
      color: #ffffff;
      border: none;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    .switch-auth {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
      color: var(--texto-mutado);
    }

    .switch-auth a {
      color: var(--texto-titulos);
      font-weight: 700;
      text-decoration: none;
    }

    .switch-auth a:hover {
      text-decoration: underline;
    }

    footer {
      border-top: 1px solid var(--borde-suave);
      padding: 20px 30px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--texto-mutado);
    }

    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      .form-group.full {
        grid-column: span 1;
      }
      .registro-container {
        padding: 20px;
        margin: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- NAVEGACIÓN SUPERIOR -->
  <nav>
    <a href="login.html" class="brand-badge"><i class="fa-solid fa-arrow-left"></i> Volver al Login</a>
    <span style="font-size: 0.85rem; color: var(--texto-mutado);">Jurisdicción Sanitaria No. 2</span>
  </nav>

  <!-- CONTENEDOR DEL FORMULARIO DE REGISTRO -->
  <main class="registro-container">
    <h2>Crear Nueva Cuenta</h2>
    <p class="sub">Registra los datos del personal e indica su rol en el sistema.</p>

    <form id="formRegistro" onsubmit="manejarRegistro(event)">
      <div class="form-grid">
        
        <div class="form-group">
          <label for="nombre">Nombre(s)</label>
          <input type="text" id="nombre" required placeholder="Ej. Juan Carlos">
        </div>

        <div class="form-group">
          <label for="nombreUsuario">Nombre de Usuario</label>
          <input type="text" id="nombreUsuario" required placeholder="Ej. jchan">
        </div>

        <div class="form-group">
          <label for="apellidoPaterno">Apellido Paterno</label>
          <input type="text" id="apellidoPaterno" required placeholder="Ej. Chan">
        </div>

        <div class="form-group">
          <label for="apellidoMaterno">Apellido Materno</label>
          <input type="text" id="apellidoMaterno" required placeholder="Ej. Canul">
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input type="text" id="telefono" required placeholder="9851234567">
        </div>

        <div class="form-group">
          <label for="rol">Rol en el Sistema</label>
          <select id="rol" required>
            <option value="" disabled selected>Selecciona un rol</option>
            <option value="ADMINISTRADOR">Administrador</option>
            <option value="TECNICO">Técnico</option>
            <option value="CONSULTA">Consulta</option>
          </select>
        </div>

        <div class="form-group full">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" required placeholder="correo@ejemplo.com">
        </div>

        <div class="form-group full">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required placeholder="Mínimo 6 caracteres">
        </div>

      </div>

      <button type="submit" class="btn-submit">Registrar Usuario</button>
    </form>

    <div class="switch-auth">
      ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a>
    </div>
  </main>

  <!-- PIE DE PÁGINA -->
  <footer>
    Servicios de Salud de Yucatán &copy; 2026 | Módulo de Autenticación
  </footer>

  <!-- SCRIPTS DE FIREBASE Y LÓGICA -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Credenciales de tu base de datos Firebase[cite: 10]
    const firebaseConfig = {
      apiKey: "AIzaSyD_y1EWlyWL054e1k8T3mkB8ROUoMD3tWs",
      authDomain: "control-de-equipos-762c4.firebaseapp.com",
      projectId: "control-de-equipos-762c4",
      storageBucket: "control-de-equipos-762c4.firebasestorage.app",
      messagingSenderId: "711982599026",
      appId: "1:711982599026:web:ba92c737011b38f882abeb",
      measurementId: "G-X1M2R00M55"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // Función de Registro con Correo y Contraseña
    window.manejarRegistro = async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const nombre = document.getElementById("nombre").value;
      const apellidoPaterno = document.getElementById("apellidoPaterno").value;
      const apellidoMaterno = document.getElementById("apellidoMaterno").value;
      const nombreUsuario = document.getElementById("nombreUsuario").value;
      const telefono = document.getElementById("telefono").value;
      const rol = document.getElementById("rol").value;

      try {
        Swal.fire({ title: 'Registrando...', text: 'Por favor espere', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        // 1. Crear usuario en Firebase Auth[cite: 9]
        const credenciales = await createUserWithEmailAndPassword(auth, email, password);
        const uid = credenciales.user.uid;

        // 2. Guardar perfil completo en la colección "usuarios" usando el UID[cite: 8, 9]
        await setDoc(doc(db, "usuarios", uid), {
          nombre,
          apellidoPaterno,
          apellidoMaterno,
          nombreUsuario,
          email,
          telefono,
          rol, // "ADMINISTRADOR", "TECNICO" o "CONSULTA"[cite: 8, 9]
          activo: true,
          fechaCreacion: new Date()
        });

        Swal.fire({
          title: '¡Registro Exitoso!',
          text: 'El usuario se ha registrado correctamente en la base de datos.',
          icon: 'success',
          confirmButtonColor: '#18181b'
        }).then(() => {
          window.location.href = "login.html";
        });

      } catch (error) {
        console.error("Error al registrar:", error);
        Swal.fire({
          title: 'Error de Registro',
          text: error.message,
          icon: 'error',
          confirmButtonColor: '#18181b'
        });
      }
    };
  </script>
</body>
</html>
