<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro deshabilitado | Jurisdicción Sanitaria No. 2</title>
  <!--
    El registro de cuentas nuevas se retiró del sistema.
    Solo entran los correos autorizados de acceso.js (acceso completo).
    Esta página se conserva únicamente para que los enlaces viejos
    lleven al inicio de sesión.
  -->
  <meta http-equiv="refresh" content="4; url=login.html">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <!-- 🌓 Aplica el modo de color guardado antes de pintar (evita parpadeo) -->
  <script>try{document.documentElement.dataset.tema=localStorage.getItem("js2_tema")||"oscuro"}catch(e){document.documentElement.dataset.tema="oscuro"}</script>
  <link rel="stylesheet" href="plano.css?v=6">
  <script src="plano.js?v=7" defer></script>
  <style>
    body { margin: 0; font-family: "Inter", system-ui, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    body::before { content: ""; position: fixed; top: 0; left: 0; width: min(48vw, 640px, calc(100vh * 0.852)); height: 100vh; background: left top / 100% auto no-repeat; pointer-events: none; z-index: -1; }
    .aviso-registro { max-width: 560px; margin: 60px auto; padding: 32px; text-align: center; }
    .aviso-registro p { margin: 14px 0 24px; line-height: 1.6; }
    .aviso-registro a { display: inline-block; padding: 11px 20px; text-decoration: none; }
  </style>
</head>
<body>
  <header class="header-institucional">
    <div class="encabezado-plano">
      <img class="img-tema-oscuro" src="img/encabezado_plano_izq.png" alt="Gobierno del Estado de Yucatán - Servicios de Salud de Yucatán">
      <img class="img-tema-claro" src="img/encabezado_claro_izq.png" alt="Gobierno del Estado de Yucatán - Servicios de Salud de Yucatán">
      <img class="img-tema-oscuro" src="img/encabezado_plano_der.png" alt="Plataforma de Salud Yucatán">
      <img class="img-tema-claro" src="img/encabezado_claro_der.png" alt="Plataforma de Salud Yucatán">
    </div>
  </header>
  <main class="register-card aviso-registro">
    <h2>Registro deshabilitado</h2>
    <p>El acceso al sistema es exclusivo para las cuentas autorizadas de la Jurisdicción Sanitaria No. 2. Si necesitas acceso, solicítalo a la jefatura.</p>
    <a href="login.html" class="btn-submit">Ir al inicio de sesión</a>
  </main>
  <footer>Servicios de Salud de Yucatán &copy; 2026 | Jurisdicción Sanitaria No. 2</footer>
</body>
</html>
